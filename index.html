<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <!-- Fonts & Icons -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">

        <!-- Leaflet & GIS CSS Stylesheets -->
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">

        <style>
            :root {
                --bg-main: #060913;
                --sidebar-bg: #0b1120;
                --card-bg: #111c34;
                --accent-blue: #3b82f6;
                --accent-cyan: #06b6d4;
                --text-main: #f3f4f6;
                --text-muted: #9ca3af;
                --border-color: #1e293b;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Inter', sans-serif;
                background-color: var(--bg-main);
                color: var(--text-main);
                display: flex;
                height: 100vh;
                overflow: hidden;
            }

            /* Sidebar Styling */
            aside {
                width: 320px;
                background-color: var(--sidebar-bg);
                border-right: 1px solid var(--border-color);
                display: flex;
                flex-direction: column;
                z-index: 1000;
                height: 100vh;
            }

            .brand-box {
                padding: 20px;
                display: flex;
                align-items: center;
                gap: 12px;
                border-bottom: 1px solid var(--border-color);
            }

            .brand-icon {
                background: linear-gradient(135deg, #3b82f6, #06b6d4);
                color: white;
                width: 40px;
                height: 40px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.2rem;
                box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            }

            .brand-title h2 {
                font-size: 0.95rem;
                font-weight: 700;
                color: white;
                letter-spacing: 0.3px;
            }

            .brand-title span {
                font-size: 0.75rem;
                color: var(--accent-cyan);
                font-weight: 500;
            }

            .section-title {
                padding: 16px 20px 8px 20px;
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: var(--text-muted);
                font-weight: 700;
            }

            /* Layers List Container */
            .layers-container {
                flex: 1;
                overflow-y: auto;
                padding: 0 16px 16px 16px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .layer-item {
                background-color: var(--card-bg);
                border: 1px solid var(--border-color);
                padding: 10px 14px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                transition: all 0.2s ease;
            }

            .layer-item:hover {
                border-color: #334155;
            }

            .layer-info {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 0.82rem;
                font-weight: 500;
                color: var(--text-main);
            }

            .layer-color-indicator {
                width: 10px;
                height: 10px;
                border-radius: 2px;
            }

            /* Custom Toggle Switch */
            .switch {
                position: relative;
                display: inline-block;
                width: 36px;
                height: 20px;
            }

            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .slider {
                position: absolute;
                cursor: pointer;
                top: 0; left: 0; right: 0; bottom: 0;
                background-color: #334155;
                transition: .3s;
                border-radius: 20px;
            }

            .slider:before {
                position: absolute;
                content: "";
                height: 14px;
                width: 14px;
                left: 3px;
                bottom: 3px;
                background-color: white;
                transition: .3s;
                border-radius: 50%;
            }

            input:checked + .slider {
                background-color: #10b981;
            }

            input:checked + .slider:before {
                transform: translateX(16px);
            }

            /* Footer Credits */
            .sidebar-footer {
                padding: 14px 20px;
                border-top: 1px solid var(--border-color);
                font-size: 0.68rem;
                color: var(--text-muted);
                line-height: 1.4;
            }

            .sidebar-footer span {
                color: #e2e8f0;
                font-weight: 600;
            }

            /* Map Container */
            #map {
                flex: 1;
                height: 100vh;
                background-color: #030712;
            }

            /* Hide default leaflet layer control box since we built a custom UI */
            .leaflet-control-layers {
                display: none !important;
            }
        </style>
        <title>GeoTrack: Solapur City Web-GIS Portal</title>
    </head>
    <body>

        <!-- Left Sidebar Panel -->
        <aside>
            <div class="brand-box">
                <div class="brand-icon"><i class="fas fa-globe-americas"></i></div>
                <div class="brand-title">
                    <h2>GeoTrack</h2>
                    <span>Solapur City Web-GIS Portal</span>
                </div>
            </div>

            <div class="section-title"><i class="fas fa-layer-group"></i> Layers & Legend</div>
            
            <div class="layers-container">
                <!-- Railways -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-indicator" style="background-color: #d1d5db;"></div>
                        <span>Railways</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle_railway" checked onchange="toggleLayer('railway')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Water Lines -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-indicator" style="background-color: #3b82f6;"></div>
                        <span>Water Lines</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle_water_line" checked onchange="toggleLayer('water_line')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Road Network -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-indicator" style="background-color: #ef4444;"></div>
                        <span>Road Network</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle_road" checked onchange="toggleLayer('road')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Water Polygons -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-indicator" style="background-color: #06b6d4;"></div>
                        <span>Water Polygons</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle_water_poly" checked onchange="toggleLayer('water_poly')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Buildings / Transport Poly -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-indicator" style="background-color: #d97706;"></div>
                        <span>Buildings & Transport</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle_transport_poly" checked onchange="toggleLayer('transport_poly')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Land Use -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-indicator" style="background-color: #f59e0b;"></div>
                        <span>Land Use</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle_landuse" checked onchange="toggleLayer('landuse')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Solapur City Boundary -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-indicator" style="background-color: #60a5fa;"></div>
                        <span>Solapur City Boundary</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle_boundary" checked onchange="toggleLayer('boundary')">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="sidebar-footer">
                Designed & Developed by: <span>GIS Expert</span><br>
                Solapur Geospatial Spatial Unit &copy; 2026
            </div>
        </aside>

        <!-- Map Area -->
        <div id="map"></div>

        <!-- Scripts -->
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-search.js"></script>
        
        <!-- Data Sources -->
        <script src="data/eportboundarysolapur_buffer_8_0.js"></script>
        <script src="data/LANDUSE_1.js"></script>
        <script src="data/water_POLY_2.js"></script>
        <script src="data/TRANSPORT_POLY_3.js"></script>
        <script src="data/ROAD__4.js"></script>
        <script src="data/water_LINE_5.js"></script>
        <script src="data/railway_LINE__6.js"></script>
        <script src="data/TRANSPORTPOINT_7.js"></script>

        <script>
        var initialBounds = [[17.568369072246142,75.76305158121636],[17.73040627612035,76.05899452995882]];
        
        var map = L.map('map', {
            zoomControl: false, 
            maxZoom: 28, 
            minZoom: 1
        }).fitBounds(initialBounds);
        
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank" style="color:#9ca3af;">qgis2web</a> &middot; <a href="https://leafletjs.com" style="color:#9ca3af;">Leaflet</a>');
        
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        // Add Zoom Control to Top-Right
        L.control.zoom({ position: 'topright' }).addTo(map);

        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        // --- Layer Definitions ---
        function pop_eportboundarysolapur_buffer_8_0(feature, layer) {
            var popupContent = '<table><tr><td colspan="2">' + (feature.properties['Vill_name'] !== null ? autolinker.link(String(feature.properties['Vill_name'])) : '') + '</td></tr></table>';
            layer.bindPopup(removeEmptyRowsFromPopupContent(popupContent, feature), { maxHeight: 400 });
        }
        function style_eportboundarysolapur_buffer_8_0_0() {
            return { pane: 'pane_eportboundarysolapur_buffer_8_0', opacity: 1, color: 'rgba(96,165,250,0.8)', weight: 1.5, fill: true, fillOpacity: 0.05, fillColor: 'rgba(59,130,246,1.0)', interactive: true }
        }
        map.createPane('pane_eportboundarysolapur_buffer_8_0');
        map.getPane('pane_eportboundarysolapur_buffer_8_0').style.zIndex = 400;
        var layer_eportboundarysolapur_buffer_8_0 = new L.geoJson(json_eportboundarysolapur_buffer_8_0, { interactive: true, pane: 'pane_eportboundarysolapur_buffer_8_0', onEachFeature: pop_eportboundarysolapur_buffer_8_0, style: style_eportboundarysolapur_buffer_8_0_0 });
        bounds_group.addLayer(layer_eportboundarysolapur_buffer_8_0);
        map.addLayer(layer_eportboundarysolapur_buffer_8_0);

        // LANDUSE Layer
        function style_LANDUSE_1_0() {
            return { pane: 'pane_LANDUSE_1', opacity: 1, color: 'rgba(35,35,35,0.5)', weight: 0.8, fill: true, fillOpacity: 0.8, fillColor: 'rgba(245,158,11,0.8)', interactive: true }
        }
        map.createPane('pane_LANDUSE_1');
        map.getPane('pane_LANDUSE_1').style.zIndex = 401;
        var layer_LANDUSE_1 = new L.geoJson(json_LANDUSE_1, { interactive: true, pane: 'pane_LANDUSE_1', style: style_LANDUSE_1_0 });
        bounds_group.addLayer(layer_LANDUSE_1);
        map.addLayer(layer_LANDUSE_1);

        // Water Poly Layer
        function style_water_POLY_2_0() {
            return { pane: 'pane_water_POLY_2', opacity: 1, color: 'rgba(35,35,35,0.5)', weight: 0.8, fill: true, fillOpacity: 0.9, fillColor: 'rgba(6,182,212,0.9)', interactive: true }
        }
        map.createPane('pane_water_POLY_2');
        map.getPane('pane_water_POLY_2').style.zIndex = 402;
        var layer_water_POLY_2 = new L.geoJson(json_water_POLY_2, { interactive: true, pane: 'pane_water_POLY_2', style: style_water_POLY_2_0 });
        bounds_group.addLayer(layer_water_POLY_2);
        map.addLayer(layer_water_POLY_2);

        // Transport Poly Layer
        function style_TRANSPORT_POLY_3_0() {
            return { pane: 'pane_TRANSPORT_POLY_3', opacity: 1, color: 'rgba(35,35,35,0.5)', weight: 0.8, fill: true, fillOpacity: 0.9, fillColor: 'rgba(217,119,6,0.9)', interactive: true }
        }
        map.createPane('pane_TRANSPORT_POLY_3');
        map.getPane('pane_TRANSPORT_POLY_3').style.zIndex = 403;
        var layer_TRANSPORT_POLY_3 = new L.geoJson(json_TRANSPORT_POLY_3, { interactive: true, pane: 'pane_TRANSPORT_POLY_3', style: style_TRANSPORT_POLY_3_0 });
        bounds_group.addLayer(layer_TRANSPORT_POLY_3);
        map.addLayer(layer_TRANSPORT_POLY_3);

        // Road Layer
        function style_ROAD__4_0() {
            return { pane: 'pane_ROAD__4', opacity: 1, color: 'rgba(239,68,68,1.0)', weight: 1.0, interactive: true }
        }
        map.createPane('pane_ROAD__4');
        map.getPane('pane_ROAD__4').style.zIndex = 404;
        var layer_ROAD__4 = new L.geoJson(json_ROAD__4, { interactive: true, pane: 'pane_ROAD__4', style: style_ROAD__4_0 });
        bounds_group.addLayer(layer_ROAD__4);
        map.addLayer(layer_ROAD__4);

        // Water Line Layer
        function style_water_LINE_5_0() {
            return { pane: 'pane_water_LINE_5', opacity: 1, color: 'rgba(59,130,246,1.0)', weight: 1.2, interactive: true }
        }
        map.createPane('pane_water_LINE_5');
        map.getPane('pane_water_LINE_5').style.zIndex = 405;
        var layer_water_LINE_5 = new L.geoJson(json_water_LINE_5, { interactive: true, pane: 'pane_water_LINE_5', style: style_water_LINE_5_0 });
        bounds_group.addLayer(layer_water_LINE_5);
        map.addLayer(layer_water_LINE_5);

        // Railway Line Layer
        function style_railway_LINE__6_0() {
            return { pane: 'pane_railway_LINE__6', opacity: 1, color: 'rgba(209,213,219,1.0)', weight: 1.5, dashArray: '3,3', interactive: true }
        }
        map.createPane('pane_railway_LINE__6');
        map.getPane('pane_railway_LINE__6').style.zIndex = 406;
        var layer_railway_LINE__6 = new L.geoJson(json_railway_LINE__6, { interactive: true, pane: 'pane_railway_LINE__6', style: style_railway_LINE__6_0 });
        bounds_group.addLayer(layer_railway_LINE__6);
        map.addLayer(layer_railway_LINE__6);

        // Toggle Layer Logic for Custom Switches
        function toggleLayer(type) {
            if(type === 'railway') {
                if(document.getElementById('toggle_railway').checked) map.addLayer(layer_railway_LINE__6);
                else map.removeLayer(layer_railway_LINE__6);
            }
            if(type === 'water_line') {
                if(document.getElementById('toggle_water_line').checked) map.addLayer(layer_water_LINE_5);
                else map.removeLayer(layer_water_LINE_5);
            }
            if(type === 'road') {
                if(document.getElementById('toggle_road').checked) map.addLayer(layer_ROAD__4);
                else map.removeLayer(layer_ROAD__4);
            }
            if(type === 'water_poly') {
                if(document.getElementById('toggle_water_poly').checked) map.addLayer(layer_water_POLY_2);
                else map.removeLayer(layer_water_POLY_2);
            }
            if(type === 'transport_poly') {
                if(document.getElementById('toggle_transport_poly').checked) map.addLayer(layer_TRANSPORT_POLY_3);
                else map.removeLayer(layer_TRANSPORT_POLY_3);
            }
            if(type === 'landuse') {
                if(document.getElementById('toggle_landuse').checked) map.addLayer(layer_LANDUSE_1);
                else map.removeLayer(layer_LANDUSE_1);
            }
            if(type === 'boundary') {
                if(document.getElementById('toggle_boundary').checked) map.addLayer(layer_eportboundarysolapur_buffer_8_0);
                else map.removeLayer(layer_eportboundarysolapur_buffer_8_0);
            }
        }

        setBounds();
        </script>
    </body>
</html>
